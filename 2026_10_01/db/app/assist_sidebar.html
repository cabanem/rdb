<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font: 13px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #202124; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 6px; }
    .status { font-size: 11px; color: #5f6368; margin-bottom: 10px; }
    .status.bad { color: #c5221f; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip { border: 1px solid #dadce0; border-radius: 14px; padding: 3px 10px; font-size: 12px; cursor: pointer; background: #fff; }
    .chip:hover { background: #f1f3f4; }
    textarea { width: 100%; box-sizing: border-box; min-height: 72px; font: inherit; padding: 8px; border: 1px solid #dadce0; border-radius: 6px; resize: vertical; }
    .row { display: flex; align-items: center; gap: 10px; margin: 8px 0 12px; }
    button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #1a73e8; background: #1a73e8; color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    label { font-size: 12px; color: #5f6368; }
    .answer { white-space: pre-wrap; border-top: 1px solid #e8eaed; padding-top: 10px; min-height: 40px; }
    .answer code { background: #f1f3f4; padding: 0 3px; border-radius: 3px; }
    .meta { font-size: 11px; color: #5f6368; margin-top: 8px; }
    .err { color: #c5221f; }
  </style>
</head>
<body>
  <h1>Config assistant</h1>
  <div id="status" class="status">Checking the corpus…</div>

  <div class="chips">
    <span class="chip" data-q="What does Strict? do, and which checks block a row regardless?">What does Strict? do</span>
    <span class="chip" data-q="Why did my latest validation fail, and what should I fix first?">Why did validation fail</span>
    <span class="chip" data-q="How do I set up a dependent dropdown?">Dependent dropdowns</span>
    <span class="chip" data-q="How do I keep leading zeros in an ID column?">Leading zeros</span>
    <span class="chip" data-q="What does the supplier see in the template for a field with Description, Required and a lookup?">What the supplier sees</span>
  </div>

  <textarea id="q" placeholder="Ask about any tab, column or preflight check…"></textarea>
  <div class="row">
    <button id="ask">Ask</button>
    <label><input type="checkbox" id="findings"> include this workbook's latest findings</label>
  </div>

  <div id="answer" class="answer"></div>
  <div id="meta" class="meta"></div>

  <script>
    var $ = function(id) { return document.getElementById(id); };

    function esc(s) { return String(s || '').replace(/[&<>]/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    // Minimal markdown: `code`, **bold**, "- " bullets. Everything else stays as typed.
    function render(md) {
      var h = esc(md).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      return h.replace(/^(?:- |\* )(.*)$/gm, '• $1');
    }

    function setStatus(s) {
      var el = $('status');
      if (!s.configured) {
        el.className = 'status bad';
        el.textContent = 'Not configured: ' + s.missing.join(', ');
        $('ask').disabled = true;
        return;
      }
      if (!s.digest || !s.digest.exists) {
        el.className = 'status bad';
        el.textContent = 'No corpus built yet. Run Supplier data collection > Build assistant corpus.';
        $('ask').disabled = true;
        return;
      }
      el.className = 'status';
      el.textContent = 'Corpus built ' + (s.digest.builtAt || '').replace('T', ' ').slice(0, 16) + ' · ' + s.digest.sources + ' source(s)';
    }

    function ask() {
      var q = $('q').value.trim();
      if (!q) return;
      $('ask').disabled = true;
      $('answer').innerHTML = '<span class="meta">Thinking…</span>';
      $('meta').textContent = '';
      google.script.run
        .withSuccessHandler(function(r) {
          $('ask').disabled = false;
          if (!r.ok) {
            $('answer').innerHTML = '<span class="err">' + esc(r.message) + '</span>';
            return;
          }
          $('answer').innerHTML = render(r.answer);
          $('meta').textContent = (r.durationMs ? Math.round(r.durationMs / 100) / 10 + ' s' : '') +
            (r.findingsIncluded ? ' · with this workbook\'s findings' : '') +
            (r.warnings && r.warnings.length ? ' · ' + r.warnings.join('; ') : '');
        })
        .withFailureHandler(function(e) {
          $('ask').disabled = false;
          $('answer').innerHTML = '<span class="err">' + esc(e.message || e) + '</span>';
        })
        .assistAsk(q, $('findings').checked);
    }

    $('ask').addEventListener('click', ask);
    $('q').addEventListener('keydown', function(e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ask(); });
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(c) {
      c.addEventListener('click', function() {
        $('q').value = c.getAttribute('data-q');
        if (/validation fail/i.test(c.getAttribute('data-q'))) $('findings').checked = true;
        ask();
      });
    });

    google.script.run.withSuccessHandler(setStatus)
      .withFailureHandler(function(e) { $('status').className = 'status bad'; $('status').textContent = e.message || e; })
      .assistStatus();
  </script>
</body>
</html>
